---
- name: Verify k3s and Docker status, configure kubectl
  hosts: all
  become: yes
  tasks:
    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Ensure k3s is running
      systemd:
        name: k3s
        state: started
        enabled: yes

- name: Configure k3s Master
  hosts: master
  become: yes
  tasks:
    - name: Get k3s node-token
      shell: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      changed_when: false

    - name: Show token (for debugging)
      debug:
        msg: "{{ k3s_token.stdout }}"

    - name: Create .kube directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy kubeconfig
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Replace localhost in kubeconfig with master IP
      replace:
        path: /home/ubuntu/.kube/config
        regexp: '127.0.0.1'
        replace: "{{ ansible_host }}"

- name: Configure k3s Worker
  hosts: workers
  become: yes
  tasks:
    - name: Ensure worker joins the K3s cluster
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars['master']['ansible_host'] }}:6443 K3S_TOKEN={{ hostvars['master']['k3s_token']['stdout'] }} sh -
      args:
        creates: /etc/systemd/system/k3s-agent.service

