- name: Install ArgoCD and Jenkins on k3s
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    # 📌 Install Kubernetes Python package using apt
    - name: Install kubernetes Python package using apt
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

    # 📌 Install kubectl on EC2 instance (if not already installed)
    - name: Install kubectl on EC2 instance
      ansible.builtin.package:
        name: kubectl
        state: present

    # 📌 Verify Kubernetes installation
    - name: Verify Kubernetes installation
      ansible.builtin.command:
        cmd: kubectl config current-context
      register: k8s_context
    - debug:
        msg: "Current Kubernetes context: {{ k8s_context.stdout }}"

    # 📌 Install ArgoCD
    - name: Download ArgoCD manifests
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        dest: /tmp/argocd-install.yaml
        mode: '0644'

    - name: Apply ArgoCD installation
      kubernetes.core.k8s:
        state: present
        src: /tmp/argocd-install.yaml

    - name: Wait for ArgoCD pods to be ready
      command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

    - name: Verify ArgoCD installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - argocd
      register: argocd_pods
    - debug:
        msg: "{{ argocd_pods.stdout }}"

    # Expose ArgoCD server via port forwarding (no LoadBalancer)
    - name: Expose ArgoCD server using port-forwarding
      ansible.builtin.shell: nohup kubectl port-forward svc/argocd-server -n argocd 8080:443 > /dev/null 2>&1 &
      async: 600
      poll: 0
      changed_when: true

    # 📌 Copy Jenkins Deployment manifest to EC2
    - name: Copy Jenkins Deployment manifest to EC2
      ansible.builtin.copy:
        src: /home/ubuntu_fe/terraform/aws/sciitdevops/ansible/Module2/ArgoCD/jenkins-deployment.yaml
        dest: /tmp/jenkins-deployment.yaml
        mode: '0644'

    # 📌 Copy Jenkins PVC manifest to EC2
    - name: Copy Jenkins PVC manifest to EC2
      ansible.builtin.copy:
        src: /home/ubuntu_fe/terraform/aws/sciitdevops/ansible/Module2/ArgoCD/jenkins-pvc.yaml
        dest: /tmp/jenkins-pvc.yaml
        mode: '0644'

    # 📌 Apply Jenkins Deployment manifest
    - name: Apply Jenkins Deployment manifest
      kubernetes.core.k8s:
        state: present
        src: /tmp/jenkins-deployment.yaml
      changed_when: true

    # 📌 Apply Jenkins PVC manifest
    - name: Apply Jenkins PVC manifest
      kubernetes.core.k8s:
        state: present
        src: /tmp/jenkins-pvc.yaml
      changed_when: true

    # 📌 Verify Jenkins installation
    - name: Verify Jenkins installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - default
      register: jenkins_pods
    - debug:
        msg: "{{ jenkins_pods.stdout }}"

    # Expose Jenkins service using NodePort (no LoadBalancer)
    - name: Expose Jenkins service via NodePort
      ansible.builtin.command:
        argv:
          - kubectl
          - expose
          - deployment
          - jenkins
          - --type=NodePort
          - --name=jenkins-service
          - --port=8080
          - --target-port=8080
      changed_when: true
