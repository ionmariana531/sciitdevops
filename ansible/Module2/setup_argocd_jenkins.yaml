- name: Install ArgoCD and Jenkins on k3s
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    # 📌 Install Kubernetes Python package using apt
    - name: Install kubernetes Python package using apt
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes apt key
      ansible.builtin.apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present
        filename: "kubernetes"

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present

    # 📌 Verify Kubernetes installation
    - name: Verify Kubernetes installation
      ansible.builtin.command:
        cmd: kubectl config current-context
      register: k8s_context
    - debug:
        msg: "Current Kubernetes context: {{ k8s_context.stdout }}"

    # 📌 Install ArgoCD
    - name: Create ArgoCD namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    # 📌 Create Jenkins namespace
    - name: Create Jenkins namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        name: jenkins
        api_version: v1
        kind: Namespace
        state: present

    - name: Install ArgoCD
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        namespace: argocd

    - name: Wait for ArgoCD pods to be ready
      command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

    - name: Verify ArgoCD installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - argocd
      register: argocd_pods
    - debug:
        msg: "{{ argocd_pods.stdout }}"

    - name: Create ArgoCD Application for Jenkins
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: jenkins
            namespace: argocd
          spec:
            destination:
              namespace: jenkins
              server: https://kubernetes.default.svc
            project: default
            source:
              repoURL: https://charts.jenkins.io
              targetRevision: "5.8.6"  # Ensure this is a valid version
              chart: jenkins
              helm:
                values: |
                  controller:
                    image:
                      registry: docker.io
                      repository: cristid9/custom-jenkins
                      tag: latest
                    serviceType: LoadBalancer
                    admin:
                      username: "admin"
                      password: "admin"  # Plain text (not recommended)
                    installPlugins:
                      - git:5.7.0
                      - kubernetes:1.30.1
                      - ssh:158.ve2a_e90fb_7319
                      - ssh-agent:384.ve275343791a_6
                      - ssh-steps:2.0.79.v1d1b_5f76dda_8
                  podSecurityContextOverride:
                    runAsNonRoot: true
                    runAsUser: 1000
                    supplementalGroups: [1000]

            syncPolicy:
              automated:
                selfHeal: true
                prune: true

