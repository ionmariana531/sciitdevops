- name: Install ArgoCD and Jenkins on k3s
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    argocd_service_type: NodePort   # Poți seta ClusterIP, NodePort sau LoadBalancer

  tasks:

    # 📌 Install Kubernetes Python package using apt
    - name: Install kubernetes Python package using apt
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes apt key
      ansible.builtin.apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present
        filename: "kubernetes"

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present

    # 📌 Verificare Kubernetes
    - name: Verify Kubernetes installation
      ansible.builtin.command:
        cmd: kubectl config current-context
      register: k8s_context
    - debug:
        msg: "Current Kubernetes context: {{ k8s_context.stdout }}"

    # 📌 Creare namespace-uri
    - name: Create ArgoCD and Jenkins namespaces
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: v1
        kind: Namespace
        state: present
        name: "{{ item }}"
      loop:
        - argocd
        - jenkins

    # 📌 Instalare ArgoCD
    - name: Install ArgoCD
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        namespace: argocd

    - name: Wait for ArgoCD pods to be ready
      command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

    # 📌 Expunere ArgoCD Server
    - name: Expose ArgoCD Server
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: argocd-server
            namespace: argocd
          spec:
            type: "{{ argocd_service_type }}"
            selector:
              app: argocd
            ports:
              - protocol: TCP
                port: 80
                targetPort: 443
                nodePort: "{{ 30080 if argocd_service_type == 'NodePort' else omit }}"  # NodePort doar dacă este cazul
      environment:
        kubeconfig: /etc/rancher/k3s/k3s.yaml

    # 📌 Obținere parolă ArgoCD
    - name: Get ArgoCD admin password
      shell: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 --decode
      register: argocd_admin_password
      ignore_errors: true

    - name: Display ArgoCD login info
      debug:
        msg: "ArgoCD UI is accessible. Login with 'admin' and password: {{ argocd_admin_password.stdout }}"

    # 📌 Creare aplicație ArgoCD pentru Jenkins
    - name: Create ArgoCD Application for Jenkins
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: argoproj.io/v1alpha1
        kind: Application
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: jenkins
            namespace: argocd
          spec:
            destination:
              namespace: jenkins
              server: https://kubernetes.default.svc
            source:
              repoURL: "https://github.com/ionmariana531/sciitdevops.git"
              targetRevision: "add-terraform-github-actions-Mariana-fe"
              path: "ansible/Module2/ArgoCD"
            project: default
            syncPolicy:
              automated:
                prune: true
                selfHeal: true

