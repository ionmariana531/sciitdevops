- name: Install ArgoCD and Jenkins on k3s
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    # 📌 Install Kubernetes Python package using apt
    - name: Install kubernetes Python package using apt
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes apt key
      ansible.builtin.apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present
        filename: "kubernetes"

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present

    # 📌 Verify Kubernetes installation
    - name: Verify Kubernetes installation
      ansible.builtin.command:
        cmd: kubectl config current-context
      register: k8s_context
    - debug:
        msg: "Current Kubernetes context: {{ k8s_context.stdout }}"

    # 📌 Install ArgoCD
    - name: Create ArgoCD namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    # 📌 Create Jenkins namespace
    - name: Create Jenkins namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        name: jenkins
        api_version: v1
        kind: Namespace
        state: present

    - name: Install ArgoCD
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        namespace: argocd

    - name: Wait for ArgoCD pods to be ready
      command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

    - name: Verify ArgoCD installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - argocd
      register: argocd_pods
    - debug:
        msg: "{{ argocd_pods.stdout }}"

    # Expose ArgoCD server via port-forwarding (no LoadBalancer)
    - name: Expose ArgoCD server using port-forwarding
      ansible.builtin.shell: nohup kubectl port-forward svc/argocd-server -n argocd 8080:443 > /dev/null 2>&1 & 
      async: 600
      poll: 0
      changed_when: true

    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        executable: /bin/bash

    - name: Add ArgoCD Helm repository
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm
        state: present

    - name: Add Jenkins Helm repository to ArgoCD
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml 
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Repository
          metadata:
            name: jenkins-helm-repo
            namespace: argocd
          spec:
            type: helm
            url: https://charts.jenkins.io
        state: present
        wait: true

    - name: Create the ArgoCD Application for Jenkins
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml 
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: jenkins
            namespace: argocd
          spec:
            destination:
              name: ''
              namespace: jenkins
              server: https://kubernetes.default.svc
            source:
              repoURL: https://github.com/helm/charts
              targetRevision: master
              chart: jenkins
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
        state: present
        wait: true
