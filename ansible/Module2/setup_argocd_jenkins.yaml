- name: Install ArgoCD and Jenkins on k3s
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    # 📌 Install Kubernetes Python package using apt
    - name: Install kubernetes Python package using apt
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes apt key
      ansible.builtin.apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present
        filename: "kubernetes"

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present

    # 📌 Verify Kubernetes installation
    - name: Verify Kubernetes installation
      ansible.builtin.command:
        cmd: kubectl config current-context
      register: k8s_context
    - debug:
        msg: "Current Kubernetes context: {{ k8s_context.stdout }}"

    # 📌 Install ArgoCD
    - name: Create ArgoCD namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml 
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    - name: Install ArgoCD
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        namespace: argocd

    - name: Wait for ArgoCD pods to be ready
      command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

        #- name: Apply ArgoCD installation
        #kubernetes.core.k8s:
        #state: present
        #src: /tmp/argocd-install.yaml
        #kubeconfig: /etc/rancher/k3s/k3s.yaml 

    - name: Wait for ArgoCD pods to be ready
      command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

    - name: Verify ArgoCD installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - argocd
      register: argocd_pods
    - debug:
        msg: "{{ argocd_pods.stdout }}"

    # Expose ArgoCD server via port forwarding (no LoadBalancer)
    - name: Expose ArgoCD server using port-forwarding
      ansible.builtin.shell: nohup kubectl port-forward svc/argocd-server -n argocd 8080:443 > /dev/null 2>&1 &
      async: 600
      poll: 0
      changed_when: true

    # 📌 Copy Jenkins Deployment manifest to EC2
    - name: Copy Jenkins Deployment manifest to EC2
      ansible.builtin.copy:
        src: ./ansible/Module2/ArgoCD/jenkins-deployment.yaml 
        dest: /tmp/jenkins-deployment.yaml
        mode: '0644'

    # 📌 Copy Jenkins PVC manifest to EC2
    - name: Copy Jenkins PVC manifest to EC2
      ansible.builtin.copy:
        src: ./ansible/Module2/ArgoCD/jenkins-deployment.yaml
        dest: /tmp/jenkins-pvc.yaml
        mode: '0644'

    # 📌 Apply Jenkins Deployment manifest
    - name: Apply Jenkins Deployment manifest
      kubernetes.core.k8s:
        state: present
        src: /tmp/jenkins-deployment.yaml
      changed_when: true

    # 📌 Apply Jenkins PVC manifest
    - name: Apply Jenkins PVC manifest
      kubernetes.core.k8s:
        state: present
        src: /tmp/jenkins-pvc.yaml
      changed_when: true

    # 📌 Verify Jenkins installation
    - name: Verify Jenkins installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - default
      register: jenkins_pods
    - debug:
        msg: "{{ jenkins_pods.stdout }}"

    # Expose Jenkins service using NodePort (no LoadBalancer)
    - name: Expose Jenkins service via NodePort
      ansible.builtin.command:
        argv:
          - kubectl
          - expose
          - deployment
          - jenkins
          - --type=NodePort
          - --name=jenkins-service
          - --port=8080
          - --target-port=8080
      changed_when: true

    # 📌 Wait for Jenkins service to be available
    - name: Wait for Jenkins service to be available
      command: kubectl wait --for=condition=available --timeout=300s deployment/jenkins
      register: jenkins_deployment_status
    - debug:
        msg: "Jenkins service is ready: {{ jenkins_deployment_status.stdout }}"

    # 📌 Ensure Jenkins is accessible on the port
    - name: Ensure Jenkins is accessible
      ansible.builtin.uri:
        url: "http://localhost:{{ jenkins_service_port }}/"
        status_code: 200
      register: jenkins_access_check
    - debug:
        msg: "Jenkins is accessible at http://localhost:{{ jenkins_service_port }}/ with status: {{ jenkins_access_check.status }}"

- name: Setup Kubernetes CLI on EC2 instance
  hosts: ec2_instances
  become: yes
  tasks:
    - name: Add the Kubernetes APT repository
      apt_repository:
        repo: 'deb https://apt.kubernetes.io/ kubernetes-xenial main'
        state: present

    - name: Add the Kubernetes signing key
      apt_key:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install kubectl
      apt:
        name: kubectl
        state: present
