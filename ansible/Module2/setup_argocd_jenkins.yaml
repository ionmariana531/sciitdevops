- name: Install ArgoCD and Jenkins on k3s
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    # 📌 Install Kubernetes Python package using apt
    - name: Install kubernetes Python package using apt
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes apt key
      ansible.builtin.apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present
        filename: "kubernetes"

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present

    # 📌 Verify Kubernetes installation
    - name: Verify Kubernetes installation
      ansible.builtin.command:
        cmd: kubectl config current-context
      register: k8s_context
    - debug:
        msg: "Current Kubernetes context: {{ k8s_context.stdout }}"

    # 📌 Install ArgoCD
    - name: Create ArgoCD namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    # 📌 Create Jenkins namespace
    - name: Create Jenkins namespace
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        name: jenkins
        api_version: v1
        kind: Namespace
        state: present

    - name: Install ArgoCD
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        namespace: argocd

    - name: Wait for ArgoCD pods to be ready
      command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s

    - name: Verify ArgoCD installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - argocd
      register: argocd_pods
    - debug:
        msg: "{{ argocd_pods.stdout }}"
# 📌 Create ArgoCD Application for Jenkins
    - name: Create ArgoCD Application for Jenkins
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        api_version: argoproj.io/v1alpha1  # Specificăm versiunea corectă de API pentru ArgoCD
        kind: Application
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1  # Definirea corectă a apiVersion pentru aplicația ArgoCD
          kind: Application
          metadata:
            name: jenkins  # Numele aplicației
          spec:
            destination:
              namespace: jenkins  # Namespace-ul unde se va aplica Jenkins
              server: https://kubernetes.default.svc  # ArgoCD va implementa în clusterul curent
            source:
              repoURL: "https://github.com/ionmariana531/sciitdevops.git"  # URL-ul depozitului Git
              targetRevision: "add-terraform-github-actions-Mariana-fe"  # Ramura din Git care va fi folosită
              path: "ansible/Module2/ArgoCD/jenkins_deployment.yaml"  # Calea către fișierul de configurare Jenkins
            project: default  # Poate fi un proiect specific ArgoCD, în acest caz, folosim `default`
            syncPolicy:
            automated:
              prune: true  # Prunează resursele neutilizate
              selfHeal: true  # Sincronizează automat aplicația când sunt schimbări în repo

