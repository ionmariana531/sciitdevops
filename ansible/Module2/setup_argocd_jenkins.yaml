---
- name: Install ArgoCD and Jenkins on k3s
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    # 📌 Install pipx if not already installed
    - name: Ensure pipx is installed
      ansible.builtin.package:
        name: pipx
        state: present

    # 📌 Install Kubernetes Python package using pipx (isolated environment)
    - name: Install kubernetes Python package using pipx
      ansible.builtin.command:
        cmd: pipx install kubernetes
      register: pipx_install_k8s

    - name: Verify Kubernetes installation with pipx
      ansible.builtin.command:
        cmd: pipx run kubectl config current-context
      register: k8s_context
    - debug:
        msg: "Current Kubernetes context: {{ k8s_context.stdout }}"

    # 📌 Install ArgoCD
    - name: Download ArgoCD manifests
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        dest: /tmp/argocd-install.yaml
        mode: '0644'

    - name: Apply metrics-server manifest to the cluster.
      kubernetes.core.k8s:
        state: present
        src: ~/metrics-server.yaml

    - name: Verify ArgoCD installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - argocd
      register: argocd_pods
    - debug:
        msg: "{{ argocd_pods.stdout }}"

    - name: Expose ArgoCD server using port-forwarding
      ansible.builtin.shell: nohup kubectl port-forward svc/argocd-server -n argocd 8080:443 > /dev/null 2>&1 &
      async: 600
      poll: 0
      changed_when: true

    # 📌 Install Jenkins
    - name: Copy Jenkins Deployment manifest
      ansible.builtin.copy:
        src: jenkins-deployment.yaml
        dest: /tmp/jenkins-deployment.yaml
        mode: '0644'

    - name: Copy Jenkins PVC manifest
      ansible.builtin.copy:
        src: jenkins-pvc.yaml
        dest: /tmp/jenkins-pvc.yaml
        mode: '0644'

    - name: Apply Jenkins Deployment manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - /tmp/jenkins-deployment.yaml
      changed_when: true

    - name: Apply metrics-server manifest to the cluster.
      kubernetes.core.k8s:
        state: present
        src: ~/metrics-server.yaml

    - name: Verify Jenkins installation
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - -n
          - default
      register: jenkins_pods
    - debug:
        msg: "{{ jenkins_pods.stdout }}"

    - name: Expose Jenkins service
      ansible.builtin.command:
        argv:
          - kubectl
          - expose
          - deployment
          - jenkins
          - --type=NodePort
          - --name=jenkins-service
          - --port=8080
          - --target-port=8080
      changed_when: true

