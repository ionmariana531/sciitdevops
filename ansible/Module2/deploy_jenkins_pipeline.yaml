- name: Deploy Jenkins Pipeline
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    git_repo_url: "https://github.com/ionmariana531/sciitdevops.git"
    git_branch: "add-terraform-github-actions-Mariana-fe"
    jenkins_admin_user: "admin"

  tasks:

    - name: Get Node IP
      shell: "hostname -I | awk '{print $1}'"
      register: node_ip
      changed_when: false

    - name: Get Jenkins Pod Name
      shell: kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get pods -n jenkins -l app.kubernetes.io/component=jenkins-controller -o jsonpath='{.items[0].metadata.name}'
      register: jenkins_pod
      changed_when: false

    - name: Get Jenkins NodePort
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
        get svc jenkins -n jenkins -o jsonpath='{.spec.ports[0].nodePort}'
      register: jenkins_nodeport
      changed_when: false

    - name: Construct Jenkins URL
      set_fact:
        jenkins_url: "http://{{ node_ip.stdout }}:{{ jenkins_nodeport.stdout | default('none') }}"

    - name: Get Jenkins Admin Password
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
        exec -n jenkins {{ jenkins_pod.stdout }} -- cat /var/jenkins_home/secrets/initialAdminPassword
      register: jenkins_password
      changed_when: false
      failed_when: jenkins_password.stdout == ""

    - name: Get Jenkins API Token
      uri:
        url: "{{ jenkins_url }}/me/descriptorByName/jenkins.security.ApiTokenProperty/generateNewToken"
        method: POST
        user: "{{ jenkins_admin_user }}"
        password: "{{ jenkins_password.stdout }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body: '{ "newTokenName": "AnsibleToken" }'
      register: jenkins_api_response

    - name: Extract Jenkins Token
      set_fact:
        jenkins_api_token: "{{ jenkins_api_response.json.data.tokenValue | default('') }}"

    - name: Debug Jenkins API Token
      debug:
        var: jenkins_api_token

    - name: Ensure token is available
      fail:
        msg: "Jenkins token is empty! Check authentication."
      when: jenkins_api_token == ""

    - name: Create a Jenkins node using token authentication
      community.general.jenkins_node:
        url: "{{ jenkins_url }}"
        user: "{{ jenkins_admin_user }}"
        token: "{{ jenkins_api_token }}"
        name: "my-node"
        remote_fs: "/home/jenkins"
        labels: "agent"
        state: present
        credentials_id: "jenkins-ssh-key"
        ssh_host: "{{ node_ip.stdout }}"
        ssh_port: 22
        ssh_private_key: "/home/ubuntu/.ssh/id_rsa"

    - name: Display Jenkins Node Creation Result?
      debug:
        msg: "Jenkins node created successfully."
