- name: Deploy Jenkins Pipeline
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    git_repo_url: "https://github.com/ionmariana531/sciitdevops.git"
    git_branch: "add-terraform-github-actions-Mariana-fe"

  tasks:
    - name: Get Node IP
      shell: "hostname -I | awk '{print $1}'"
      register: node_ip
      changed_when: false

    - name: Ensure Jenkins user exists
      user:
        name: jenkins
        state: present
        shell: /bin/bash

    - name: Install ACL package
      apt:
        name: acl
        state: present

    - name: Add Jenkins user to Docker group
      user:
        name: jenkins
        group: docker
        append: yes

    - name: Get Jenkins NodePort
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
        get svc jenkins -n jenkins -o jsonpath='{.spec.ports[0].nodePort}'
      register: jenkins_nodeport
      changed_when: false

    - name: Construct Jenkins URL
      set_fact:
        jenkins_url: "http://{{ node_ip.stdout }}:{{ jenkins_nodeport.stdout | default('none') }}"

    - name: Display Jenkins URL
      debug:
        msg: "Jenkins is available at {{ jenkins_url }}"

    - name: Get Jenkins Admin Password
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
        get secret jenkins-admin-secret -n jenkins -o jsonpath='{.data.jenkins-admin-password}' | base64 --decode
      register: jenkins_password
      changed_when: false

    - name: Clone the repository to get pipeline.xml
      git:
        repo: "{{ git_repo_url }}"
        dest: "/home/ubuntu/jenkins_repo"
        version: "{{ git_branch }}"
        update: yes
      register: git_clone_result

    - name: Check if pipeline.xml exists
      stat:
        path: "/home/ubuntu/jenkins_repo/pipeline.xml"
      register: pipeline_file

    - name: Ensure /var/jenkins_home directory exists
      file:
        path: /var/jenkins_home
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Copy pipeline.xml to Jenkins server
      ansible.builtin.copy:
        src: "/home/ubuntu/jenkins_repo/pipeline.xml"
        dest: "/var/jenkins_home/pipeline.xml"
        mode: "0644"
        remote_src: yes
      when: pipeline_file.stat.exists

    - name: Change ownership of pipeline.xml to jenkins user
      file:
        path: "/var/jenkins_home/pipeline.xml"
        owner: jenkins
        group: jenkins
        mode: '0644'
      when: pipeline_file.stat.exists

    - name: Ensure /home/jenkins/.ansible/tmp has correct permissions
      file:
        path: "/home/jenkins/.ansible/tmp"
        state: directory
        mode: '1777'
        owner: jenkins
        group: jenkins
      become: true

    - name: Create Jenkins Job using curl
      shell: |
        JENKINS_URL="{{ jenkins_url }}"
        JENKINS_USER="admin"
        JENKINS_PASS="{{ jenkins_password.stdout }}"
        PIPELINE_FILE="/var/jenkins_home/pipeline.xml"

        if [ -f "$PIPELINE_FILE" ]; then
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$JENKINS_URL/createItem?name=GitHub-Pipeline" \
            --user "$JENKINS_USER:$JENKINS_PASS" \
            -H "Content-Type: application/xml" \
            --data-binary @"$PIPELINE_FILE")

          if [ "$RESPONSE" -ne 200 ]; then
            echo "Failed to create Jenkins job! HTTP response code: $RESPONSE"
            exit 1
          else
            echo "Jenkins job created successfully!"
          fi
        else
          echo "Error: pipeline.xml not found!"
          exit 1
        fi
      become: true
      become_user: jenkins
      when: pipeline_file.stat.exists
