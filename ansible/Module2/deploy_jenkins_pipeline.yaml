---
- name: Deploy Python Weather App from EC2
  hosts: all
  become: yes  # Rulează ca root
  gather_facts: no

  tasks:
    - name: Get Jenkins pod name
      shell: |
        kubectl get pods -n jenkins -l app=jenkins -o jsonpath='{.items[0].metadata.name}'
      register: jenkins_pod_name
      changed_when: false

    - name: Read ArgoCD password from S3 mount
      command: cat /mnt/s3/argocd_password.txt
      register: argocd_password
      changed_when: false

    - name: Overwrite Jenkins initial admin password with ArgoCD password
      shell: |
        kubectl exec -it {{ jenkins_pod_name.stdout }} -n jenkins -- \
        bash -c "echo '{{ argocd_password.stdout }}' > /var/jenkins_home/secrets/initialAdminPassword"
      changed_when: true

    - name: Restart Jenkins pod to apply new password
      shell: |
        kubectl delete pod -n jenkins {{ jenkins_pod_name.stdout }}
      changed_when: true

    - name: Get Jenkins service name
      shell: "kubectl get svc -n jenkins -o jsonpath='{.items[0].metadata.name}'"
      register: jenkins_service
      changed_when: false

    - name: Get Jenkins NodePort
      shell: "kubectl get svc -n jenkins {{ jenkins_service.stdout }} -o jsonpath='{.spec.ports[0].nodePort}'"
      register: jenkins_nodeport
      changed_when: false

    - name: Determine Jenkins URL using NodePort
      set_fact:
        jenkins_url: "http://{{ ansible_host }}:{{ jenkins_nodeport.stdout }}"

    - name: Display Jenkins URL
      debug:
        msg: "Access Jenkins at: {{ jenkins_url }} with password from /mnt/s3/argocd_password.txt"

