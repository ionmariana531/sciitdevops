---
- name: Deploy Jenkins Pipeline using AWS Secrets Manager
  hosts: master
  become: yes

  tasks:

    #####################################################
    # ✅ Retrieve GitHub Repo URL from Secrets Manager
    #####################################################
    - name: Retrieve GitHub Repo URL from Secrets Manager
      shell: >
        aws secretsmanager get-secret-value --secret-id arn:aws:secretsmanager:eu-west-1:329599661643:secret:github_repo_url_secret_name-TFXRnu --query SecretString --output text | jq -r '.GH_REPO_URL'
      register: github_repo_url
      failed_when: github_repo_url.stdout == ""

    - name: Clean GitHub Repo URL
      set_fact:
        clean_github_repo_url: "{{ github_repo_url.stdout | trim }}"

    #####################################################
    # ✅ Retrieve GitHub Username from Secrets Manager
    #####################################################
    - name: Retrieve GitHub Username from Secrets Manager
      shell: >
        aws secretsmanager get-secret-value --secret-id arn:aws:secretsmanager:eu-west-1:329599661643:secret:github_user_secret_name-TFXRnu --query SecretString --output text | jq -r '.GH_USER'
      register: github_user
      failed_when: github_user.stdout == ""

    #####################################################
    # ✅ Retrieve GitHub Token from Secrets Manager
    #####################################################
    - name: Retrieve GitHub Token from Secrets Manager
      shell: >
        aws secretsmanager get-secret-value --secret-id arn:aws:secretsmanager:eu-west-1:329599661643:secret:github_token_secret_name-TFXRnu --query SecretString --output text | jq -r '.GH_TOKEN'
      register: github_token
      failed_when: github_token.stdout == ""

    #####################################################
    # ✅ Install GitHub Plugin in Jenkins using Jenkins CLI
    #####################################################
    - name: Download Jenkins CLI jar
      get_url:
        url: "http://{{ inventory_hostname }}:30080/jnlpJars/jenkins-cli.jar"
        dest: "/tmp/jenkins-cli.jar"
      register: download_jenkins_cli
      until: download_jenkins_cli is succeeded
      retries: 10
      delay: 10

    - name: Download GitHub plugin
      get_url:
        url: "https://updates.jenkins.io/download/plugins/github/1.42.0/github.hpi"
        dest: "/tmp/github.hpi"
      register: download_github_plugin
      until: download_github_plugin is succeeded
      retries: 10
      delay: 10

    - name: Install GitHub plugin
      shell: |
        java -jar /tmp/jenkins-cli.jar -s http://{{ inventory_hostname }}:30080 -auth "admin:{{ jenkins_password }}" install-plugin github -restart
      environment:
        JENKINS_USER: "admin"
        JENKINS_PASSWORD: "{{ jenkins_password }}"
      register: install_github_plugin
      until: install_github_plugin.rc == 0
