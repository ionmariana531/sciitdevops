---
- name: Deploy Jenkins Pipeline using AWS Secrets Manager
  hosts: jenkins_server
  become: yes

  tasks:
    ####################################################
    # Retrieve GitHub Repo URL from AWS Secrets Manager
    ####################################################
    - name: Get GitHub Repo URL
      shell: >
        aws secretsmanager get-secret-value --secret-id github_repo_url --query SecretString --output text | jq -r '.GH_REPO_URL'
      register: github_repo_url
      failed_when: github_repo_url.stdout == ""

    - name: Get GitHub Username
      shell: >
        aws secretsmanager get-secret-value --secret-id github_user --query SecretString --output text | jq -r '.GH_USER'
      register: github_user
      failed_when: github_user.stdout == ""

    - name: Get GitHub Token
      shell: >
        aws secretsmanager get-secret-value --secret-id github_token --query SecretString --output text | jq -r '.GH_TOKEN'
      register: github_token
      failed_when: github_token.stdout == ""

    ####################################################
    # Trigger Jenkins Job Directly
    ####################################################
    - name: Trigger Jenkins Job
      shell: |
        curl -X POST "http://{{ inventory_hostname }}:8080/job/python-app-deploy/buildWithParameters" \
        --user "admin:admin_jenkins_api_token" \
        --data-urlencode "GH_USER={{ github_user.stdout | trim }}" \
        --data-urlencode "GH_TOKEN={{ github_token.stdout | trim }}" \
        --data-urlencode "GH_REPO_URL={{ github_repo_url.stdout | trim }}"
      register: jenkins_trigger
      failed_when: jenkins_trigger.rc != 0

    - name: Show Jenkins Trigger Output
      debug:
        msg: "Trigger Response: {{ jenkins_trigger.stdout }}"

