- name: Deploy Jenkins Pipeline
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    git_repo_url: "https://github.com/ionmariana531/sciitdevops.git"
    git_branch: "add-terraform-github-actions-Mariana-fe"
  tasks:

    - name: Get Node IP
      shell: "hostname -I | awk '{print $1}'"
      register: node_ip
      changed_when: false

    - name: Get Jenkins NodePort (async)
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
        get svc jenkins -n jenkins -o jsonpath='{.spec.ports[0].nodePort}'
      register: jenkins_nodeport_job
      changed_when: false
      async: 300
      poll: 0

    - name: Wait for async job
      async_status:
        jid: "{{ jenkins_nodeport_job.ansible_job_id }}"
      register: jenkins_nodeport
      until: jenkins_nodeport.finished
      retries: 10
      delay: 5

    - name: Display Jenkins NodePort
      debug:
        var: jenkins_nodeport

    - name: Construct Jenkins URL
      set_fact:
        jenkins_url: "http://{{ node_ip.stdout }}:{{ jenkins_nodeport.stdout | default('none') }}"

    - name: Display Jenkins URL
      debug:
        msg: "Jenkins is available at {{ jenkins_url }}"

    - name: Save Jenkins URL to file
      copy:
        content: "{{ jenkins_url }}"
        dest: "/mnt/s3/jenkins_url.txt"
        mode: "0644"

    - name: Show Jenkins Pod Name
      debug:
        var: jenkins_pod.stdout

    - name: Get Jenkins Admin Password
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
        exec -n jenkins $(kubectl get pod -n jenkins -l app=jenkins -o jsonpath='{.items[0].metadata.name}') \
        -- cat /var/jenkins_home/secrets/initialAdminPassword
      register: jenkins_password
      changed_when: false

    - name: Ensure curl is installed
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: yes

    - name: Clone the repository to get pipeline.xml
      git:
        repo: "{{ git_repo_url }}"
        dest: "/home/ubuntu/jenkins_repo"
        version: "{{ git_branch }}"
        update: yes
      register: git_clone_result

    - name: Check if pipeline.xml exists
      stat:
        path: "/home/ubuntu/jenkins_repo/pipeline.xml"
      register: pipeline_file

    - name: Get CSRF token from Jenkins
      shell: >
        curl -k -X GET "http://admin:{{ jenkins_password.stdout }}@{{ jenkins_url | regex_replace('http://', '') }}/crumbIssuer/api/json"
      register: csrf_token_response
      failed_when: csrf_token_response.rc != 0

    - name: Debug CSRF token response
      debug:
        var: csrf_token_response.stdout

    - name: Extract Jenkins Crumb from response
      set_fact:
        jenkins_crumb: "{{ csrf_token_response.stdout | regex_search('\"crumb\":\"([^\"]+)\"', '\\1') | first | default('') }}"

    - name: Debug Jenkins Crumb
      debug:
        var: jenkins_crumb

    - name: Create Jenkins Job using curl
      shell: >
        curl -k -X POST "http://admin:{{ jenkins_password.stdout }}@{{ jenkins_url | regex_replace('http://', '') }}/createItem?name=GitHub-Pipeline"
        -H "Content-Type: application/xml"
        -H "Jenkins-Crumb: {{ jenkins_crumb }}"
        --data-binary "@/home/ubuntu/jenkins_repo/pipeline.xml"
      register: jenkins_job_response
      failed_when: jenkins_job_response.rc != 0

    - name: Display Jenkins Job Response?
      debug:
        var: jenkins_job_response.stdout
