- name: Creează job-ul Jenkins folosind curl
  hosts: master
  become: yes
  tasks:
    - name: Extrage Jenkins URL din Kubernetes
      shell: kubectl get secret jenkins-admin-secret -o jsonpath='{.data.JENKINS_URL}' -n jenkins | base64 --decode
      register: jenkins_url

    - name: Extrage Jenkins password din Kubernetes
      shell: kubectl get secret jenkins-admin-secret -o jsonpath='{.data.JENKINS_PASSWORD}' -n jenkins | base64 --decode
      register: jenkins_password

    - name: Creează job-ul Jenkins folosind curl
      shell: >
        curl -k -X POST "https://admin:{{ jenkins_password.stdout }}@{{ jenkins_url.stdout | regex_replace('https://', '') }}/createItem?name=GitHub-Pipeline" 
        -H "Content-Type: application/xml" 
        --data-binary "@pipeline.xml"
      register: jenkins_job_response
      failed_when: jenkins_job_response.rc != 0

