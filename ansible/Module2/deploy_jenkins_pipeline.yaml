---
- name: Deploy Jenkins Pipeline
  hosts: master
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    git_repo_url: "https://github.com/ionmariana531/sciitdevops.git"
    git_branch: "add-terraform-github-actions-Mariana-fe"
    jenkins_url: "http://your-jenkins-url"  # URL-ul complet al Jenkins
    jenkins_password: "your-jenkins-password"  # Parola de Jenkins, poți extrage din secret sau altă sursă

  tasks:
    - name: Get Node IP
      shell: "hostname -I | awk '{print $1}'"
      register: node_ip
      changed_when: false

    - name: Ensure Jenkins user exists
      user:
        name: jenkins
        state: present
        shell: /bin/bash

    - name: Install ACL package
      apt:
        name: acl
        state: present

    - name: Add Jenkins user to Docker group
      user:
        name: jenkins
        group: docker
        append: yes

    - name: Get Jenkins NodePort
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
        get svc jenkins -n jenkins -o jsonpath='{.spec.ports[0].nodePort}'
      register: jenkins_nodeport
      changed_when: false

    - name: Construct Jenkins URL
      set_fact:
        jenkins_url: "http://{{ node_ip.stdout }}:{{ jenkins_nodeport.stdout | default('none') }}"

    - name: Display Jenkins URL
      debug:
        msg: "Jenkins is available at {{ jenkins_url }}"

    - name: Get Jenkins pod name
      shell: "kubectl get pods -n jenkins -l app=jenkins -o jsonpath='{.items[0].metadata.name}'"
      register: jenkins_pod_name

    - name: Get Jenkins initial admin password using kubectl
      shell: kubectl exec -n jenkins {{ jenkins_pod_name.stdout }} -- cat /var/jenkins_home/secrets/initialAdminPassword
      register: jenkins_admin_password
      no_log: false  # pentru a afișa parola în output-ul ansible

    - name: Show Jenkins admin password
      debug:
        msg: "Jenkins Admin Password: {{ jenkins_admin_password.stdout }}"

    - name: Download Jenkins CLI jar
      get_url:
        url: "{{ jenkins_url }}/jnlpJars/jenkins-cli.jar"
        dest: "/tmp/jenkins-cli.jar"

    - name: Install OpenJDK 17
      become: yes
      apt:
        name: openjdk-17-jre
        state: present
      when: ansible_os_family == "Debian"

    - name: Set JAVA_HOME for current session
      become: yes
      shell: |
        export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
        echo "JAVA_HOME=$JAVA_HOME" >> /etc/profile
      when: ansible_os_family == "Debian"

    - name: Install GitHub plugin using jenkins-cli without restart
      shell: |
        java -jar /tmp/jenkins-cli.jar -s {{ jenkins_url }} -auth "admin:{{ jenkins_admin_password.stdout }}" install-plugin github
      register: github_plugin_result

    - name: Restart Jenkins to apply plugin (only if needed)
      shell: |
        java -jar /tmp/jenkins-cli.jar -s {{ jenkins_url }} -auth "admin:{{ jenkins_admin_password.stdout }}" safe-restart
      when: github_plugin_result.rc == 0

    - name: Wait for Jenkins to come back online
      uri:
        url: "{{ jenkins_url }}/login"
        method: GET
        status_code: 200
        validate_certs: no
      register: result
      until: result.status == 200
      retries: 15    # Încearcă de 15 ori (~5 minute)
      delay: 20      # Așteaptă 20 secunde între încercări

    - name: Clone the repository to get pipeline.xml
      git:
        repo: "{{ git_repo_url }}"
        dest: "/home/ubuntu/jenkins_repo"
        version: "{{ git_branch }}"
        update: yes
      register: git_clone_result

    - name: Check if pipeline.xml exists
      stat:
        path: "/home/ubuntu/jenkins_repo/pipeline.xml"
      register: pipeline_file

    - name: Ensure /var/jenkins_home directory exists
      file:
        path: /var/jenkins_home
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Copy pipeline.xml to Jenkins server
      ansible.builtin.copy:
        src: "/home/ubuntu/jenkins_repo/pipeline.xml"
        dest: "/var/jenkins_home/pipeline.xml"
        mode: "0644"
        remote_src: yes
      when: pipeline_file.stat.exists

    - name: Change ownership of pipeline.xml to jenkins user
      file:
        path: "/var/jenkins_home/pipeline.xml"
        owner: jenkins
        group: jenkins
        mode: '0644'
      when: pipeline_file.stat.exists

    - name: Debug jenkins_url
      debug:
        msg: "Jenkins URL: {{ jenkins_url | regex_replace('https://', '') }}"

    - name: Dezactivează protecția CSRF în Jenkins
      shell: |
        curl -k -X POST "http://{{ jenkins_user }}:{{ jenkins_admin_password.stdout }}@{{ jenkins_url }}/configureSecurity" \
        -d "csrfProtection=false"
      register: disable_csrf_response
      failed_when: disable_csrf_response.rc != 0

    - name: Create Jenkins Pipeline Job
      shell: |
        curl -k -X POST "http://admin:{{ jenkins_admin_password.stdout }}@{{ node_ip.stdout }}:{{ jenkins_nodeport.stdout }}/createItem?name=GitHub-Pipeline" \
        -H "Content-Type: application/xml" \
        --data-binary "@/var/jenkins_home/pipeline.xml"
      register: jenkins_job_response
      failed_when: false

    - name: Rulează pipeline-ul în Jenkins folosind curl
      shell: |
        curl -k -X POST "http://admin:{{ jenkins_admin_password.stdout }}@{{ node_ip.stdout }}:{{ jenkins_nodeport.stdout }}/job/GitHub-Pipeline/build"
      register: jenkins_build_response
      failed_when: jenkins_build_response.rc != 0
      changed_when: false  # Task-ul nu va fi considerat ca având succes, chiar dacă este deja prezent

    - name: Debug job creation response
      debug:
        var: jenkins_job_response
