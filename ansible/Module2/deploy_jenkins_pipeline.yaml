---
- name: Deploy Jenkins Pipeline using AWS Secrets Manager
  hosts: master 
  become: yes

  tasks:
    ####################################################
    # Retrieve GitHub Credentials from AWS Secrets Manager
    ####################################################
    - name: Get GitHub Repo URL
      shell: >
        aws secretsmanager get-secret-value --secret-id github_repo_url --query SecretString --output text | jq -r '.GH_REPO_URL'
      register: github_repo_url
      failed_when: github_repo_url.stdout == ""

    - name: Get GitHub Username
      shell: >
        aws secretsmanager get-secret-value --secret-id github_user --query SecretString --output text | jq -r '.GH_USER'
      register: github_user
      failed_when: github_user.stdout == ""

    - name: Get GitHub Token
      shell: >
        aws secretsmanager get-secret-value --secret-id github_token --query SecretString --output text | jq -r '.GH_TOKEN'
      register: github_token
      failed_when: github_token.stdout == ""

    ####################################################
    # Trigger Jenkins Job with Parameters
    ####################################################
    - name: Trigger Jenkins Job
      shell: |
        curl -X POST "http://{{ inventory_hostname }}:30080/job/python-app-deploy/buildWithParameters" \
        --user "admin:admin_jenkins_api_token" \
        --data-urlencode "GH_USER={{ github_user.stdout | trim }}" \
        --data-urlencode "GH_TOKEN={{ github_token.stdout | trim }}" \
        --data-urlencode "GH_REPO_URL={{ github_repo_url.stdout | trim }}"
      register: jenkins_trigger
      failed_when: jenkins_trigger.rc != 0

    - name: Show Jenkins Trigger Output
      debug:
        msg: "Trigger Response: {{ jenkins_trigger.stdout }}"

####################################################
# Install GitHub Plugin in Jenkins
####################################################
    - name: Download Jenkins CLI jar
      shell: curl -o /tmp/jenkins-cli.jar http://{{ inventory_hostname }}:30080/jnlpJars/jenkins-cli.jar
      register: download_jenkins_cli
      retries: 10
      delay: 10

    - name: Download GitHub plugin
      shell: curl -o /tmp/github.hpi https://updates.jenkins.io/download/plugins/github/1.42.0/github.hpi
      register: download_github_plugin
      retries: 10
      delay: 10

    - name: Install GitHub plugin
      shell: java -jar /tmp/jenkins-cli.jar -s http://{{ inventory_hostname }}:30080 -auth "admin:{{ jenkins_password }}" install-plugin github -restart
      register: install_github_plugin
      retries: 10
      delay: 10

    - name: Wait for Jenkins to come back online
      shell: curl -s -o /dev/null -w "%{http_code}" http://{{ inventory_hostname }}:30080/login
      register: result
      retries: 15
      delay: 20
      until: result.stdout == "200"

####################################################
# Create Jenkins Job from XML Config
####################################################
    - name: Create Jenkins Job
      shell: |
        curl -X POST "http://admin:{{ jenkins_password }}@{{ inventory_hostname }}:30080/createItem?name=GitHub-Pipeline" \
        -H "Content-Type: application/xml" \
        --data-binary "@{{ playbook_dir }}/pipeline.xml"
      register: jenkins_job_response
      failed_when: jenkins_job_response.rc != 0
      changed_when: false

    - name: Debug Jenkins Job Creation Response
      debug:
        msg: "Jenkins Job Creation Response: {{ jenkins_job_response.stdout }}"

####################################################
# Run Jenkins Pipeline Job
####################################################
    - name: Run Jenkins Pipeline Job
      shell: curl -X POST "http://admin:{{ jenkins_password }}@{{ inventory_hostname }}:30080/job/GitHub-Pipeline/build"
      register: jenkins_build_response
      failed_when: jenkins_build_response.rc != 0
      changed_when: false

    - name: Debug Jenkins Build Response
      debug:
        msg: "Jenkins Build Response: {{ jenkins_build_response.stdout }}"
