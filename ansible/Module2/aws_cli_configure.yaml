- name: Configure AWS CLI on EC2
  hosts: all
  become: yes

  tasks:
    - name: Ensure AWS CLI is installed
      package:
        name: awscli
        state: present

    - name: Configure AWS CLI with access key
      shell: aws configure set aws_access_key_id {{ aws_access_key_id }}

    - name: Configure AWS CLI with secret key
      shell: aws configure set aws_secret_access_key {{ aws_secret_access_key }}

    - name: Configure AWS CLI with region
      shell: aws configure set region {{ aws_region }}
