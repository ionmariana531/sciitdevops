name: "Terraform CI/CD"

on:
  push:
    branches:
      - add-terraform-github-actions-Mariana-fe

  workflow_dispatch:

jobs:
  provision-ec2:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v3

      # Configure AWS credentials
      - uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          aws-secret-access-key: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          aws-region: 'eu-west-1'

      # Terraform Setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      # Generate Ansible Inventory File based on Terraform output
      - name: Generate Ansible Inventory
        run: |
          echo "[master]" > ansible/inventory.ini
          INSTANCE_IPS=$(terraform output -json instance_ips)
          MASTER_IP=$(echo "$INSTANCE_IPS" | jq -r '.[0]')
          echo "$MASTER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/app-ssh-key.pem" >> ansible/inventory.ini

      # Add SSH Keys from GitHub Secrets
      - name: Add SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/app-ssh-key.pem
          echo "${{ secrets.AWS_SSH_PUBLIC_KEY }}" > ~/.ssh/app-ssh-key.pub
          chmod 600 ~/.ssh/app-ssh-key.pem
          chmod 644 ~/.ssh/app-ssh-key.pub

      # Debug SSH Key
      - name: Debug SSH Key
        run: |
          echo "Listing .ssh directory:"
          ls -l ~/.ssh/
          echo "Public Key:"
          cat ~/.ssh/app-ssh-key.pub
          echo "Private Key (first 5 lines only for security):"
          head -n 5 ~/.ssh/app-ssh-key.pem

      # Test SSH connection (with retries)
      - name: Test SSH connection
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          echo "Adding $INSTANCE_IP to known_hosts..."
          ssh-keyscan -H $INSTANCE_IP >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "Trying to SSH into $INSTANCE_IP"
          RETRIES=5
          SUCCESS=0
          for i in $(seq 1 $RETRIES); do
            if ssh -v -o StrictHostKeyChecking=no -i ~/.ssh/app-ssh-key.pem ubuntu@$INSTANCE_IP; then
              SUCCESS=1
              break
            else
              echo "❌ Attempt $i failed. Retrying in $((i * 20)) seconds..."
              sleep $((i * 20))
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "❌ SSH connection failed after $RETRIES attempts."
            exit 1
          fi
          echo "✅ SSH connection successful!"

      # Add known_hosts on EC2
      - name: Add known_hosts on EC2
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          echo "Adding $INSTANCE_IP to known_hosts on EC2..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/app-ssh-key.pem ubuntu@$INSTANCE_IP \
            "mkdir -p ~/.ssh && ssh-keyscan -H $INSTANCE_IP >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts"
          echo "✅ known_hosts updated on EC2!"

      # Copy inventory.ini to EC2
      - name: Copy inventory.ini to EC2
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          scp -i ~/.ssh/app-ssh-key.pem -o StrictHostKeyChecking=no ansible/inventory.ini ubuntu@$INSTANCE_IP:/home/ubuntu/inventory.ini
          echo "✅ inventory.ini successfully copied to EC2"

      # Install Python 3.9+, Ansible, and dependencies
      - name: Install Ansible and dependencies
        run: |
          sudo apt update && sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt update
          sudo apt install -y python3.9 python3.9-venv python3.9-dev ansible
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.9
          python3.9 -m pip install --upgrade pip
          python3.9 -m pip install openshift pyyaml kubernetes jsonpatch
          ansible-galaxy collection install kubernetes.core
          ansible --version

      # Verify pip installation
      - name: Verify pip installation
        run: python3.9 -m pip --version

      # Run Ansible playbooks
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/Module2/collection-requirements.yaml
      - name: Run Ansible Playbook
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yaml -vvv
      - name: Run Ansible Playbook to configure k3s cluster
        run: ansible-playbook -i ansible/inventory.ini ansible/Module2/configure_k3s_cluster.yaml -vvv
      - name: Run Ansible Playbook for ArgoCD & Jenkins
        run: ansible-playbook -i ansible/inventory.ini ansible/Module2/setup_argocd_jenkins.yaml -vvv

