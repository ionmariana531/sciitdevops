---
name: "Terraform CI/CD"

on:
  push:
    branches:
      - add-terraform-github-actions-Mariana-fe
  workflow_dispatch:

jobs:
  provision-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          aws-secret-access-key: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          aws-region: 'eu-west-1'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Generate Terraform Outputs
        run: terraform output -json > terraform_output.json

      - name: Generate Ansible Inventory
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          echo "[master]" > ansible/inventory.ini
          echo "$INSTANCE_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/app-ssh-key.pem" >> ansible/inventory.ini
          cat ansible/inventory.ini
          pwd
          echo "$(pwd)/ansible/inventory.ini"

      - name: Add SSH Keys on Runner
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/app-ssh-key.pem
          echo "${{ secrets.AWS_SSH_PUBLIC_KEY }}" > ~/.ssh/app-ssh-key.pub
          chmod 600 ~/.ssh/app-ssh-key.pem
          chmod 644 ~/.ssh/app-ssh-key.pub
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Wait for SSH to become available
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          WAIT_TIME=5
          MAX_WAIT_TIME=60
          RETRIES=0
          while ! nc -zv $INSTANCE_IP 22 && [ $RETRIES -lt 10 ]; do
            echo "Waiting for SSH to become available... Retry $((RETRIES+1))"
            sleep $WAIT_TIME
            RETRIES=$((RETRIES + 1))
            WAIT_TIME=$((WAIT_TIME + 5))
            if [ $WAIT_TIME -gt $MAX_WAIT_TIME ]; then
              WAIT_TIME=$MAX_WAIT_TIME
            fi
          done
          if [ $RETRIES -ge 10 ]; then
            echo "SSH did not become available after 10 attempts."
            exit 1
          fi
          echo "SSH is now available on $INSTANCE_IP"

      - name: Test SSH connection
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/app-ssh-key.pem ubuntu@$INSTANCE_IP "exit"

      - name: Copy SSH keys (private & public) to EC2
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          scp -i ~/.ssh/app-ssh-key.pem -o StrictHostKeyChecking=no ~/.ssh/app-ssh-key.pem ubuntu@$INSTANCE_IP:/home/ubuntu/.ssh/app-ssh-key.pem
          scp -i ~/.ssh/app-ssh-key.pem -o StrictHostKeyChecking=no ~/.ssh/app-ssh-key.pub ubuntu@$INSTANCE_IP:/home/ubuntu/.ssh/app-ssh-key.pub
          ssh -i ~/.ssh/app-ssh-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@$INSTANCE_IP << 'EOF'
            chmod 600 /home/ubuntu/.ssh/app-ssh-key.pem
            chmod 644 /home/ubuntu/.ssh/app-ssh-key.pub
            cat /home/ubuntu/.ssh/app-ssh-key.pub >> /home/ubuntu/.ssh/authorized_keys
            chmod 600 /home/ubuntu/.ssh/authorized_keys
            echo "SSH keys transferred and configured successfully."
          EOF

      - name: Copy AWS Credentials to EC2
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/app-ssh-key.pem ubuntu@$INSTANCE_IP << 'EOF'
            echo "${{ secrets.AWS_ACCESS_KEY_ID }}:${{ secrets.AWS_SECRET_ACCESS_KEY }}" | sudo tee /etc/passwd-s3fs > /dev/null
            sudo chmod 600 /etc/passwd-s3fs
          EOF

      - name: Install Ansible on EC2
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/app-ssh-key.pem ubuntu@$INSTANCE_IP << 'EOF'
            sudo apt update
            sudo apt install -y ansible
          EOF

      - name: Install Ansible collections on the runner
        run: |
          ansible-galaxy collection install kubernetes.core --force
          ansible-galaxy collection install -r ./ansible/Module2/collection-requirements.yaml --force

      # Step to run the first playbook
      - name: Run Playbook 1 
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yaml -vvv -u ubuntu --private-key ~/.ssh/app-ssh-key.pem

      # Step to run the second playbook
      - name: Run Playbook 2 
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          ansible-playbook -i ansible/inventory.ini ansible/Module2/configure_k3s_cluster.yaml -vvv -u ubuntu --private-key ~/.ssh/app-ssh-key.pem

      # Step to run the third playbook
      - name: Run Playbook 3
        run: |
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          ansible-playbook -i ansible/inventory.ini ansible/Module2/setup_argocd_jenkins.yaml -vvv -u ubuntu --private-key ~/.ssh/app-ssh-key.pem

      - name: Run Playbook 4 
        run: | 
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}"
          INSTANCE_IP=$(terraform output -json instance_ips | jq -r '.[0]')
          ansible-playbook -i ansible/inventory.ini ansible/Module2/deploy_jenkins_pipeline-3.yaml -vvvv -u ubuntu --private-key ~/.ssh/app-ssh-key.pem
             
